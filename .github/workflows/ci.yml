name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python 3.12, PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kuzenga_ci
          POSTGRES_USER: kuzenga_ci
          POSTGRES_PASSWORD: kuzenga_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kuzenga_ci -d kuzenga_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: kuzenga

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://kuzenga_ci:kuzenga_ci_password@localhost:5432/kuzenga_ci
      DJANGO_SECRET_KEY: ci-only-not-a-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            kuzenga/requirements/base.txt
            kuzenga/requirements/development.txt
            kuzenga/requirements/constraints.txt

      - name: Install pinned project dependencies
        run: python -m pip install --requirement requirements/development.txt

      - name: Verify dependency installation
        run: python -m pip check

      - name: Run Ruff checks
        run: python -m ruff check .

      - name: Run Django system checks
        run: python manage.py check

      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run

      - name: Apply database migrations
        run: python manage.py migrate --noinput

      - name: Run pytest suite
        run: python -m pytest -ra

      - name: Verify Vercel build configuration and compile Tailwind
        run: |
          python -m json.tool vercel.json > /dev/null
          npx --yes tailwindcss@3.4.17 --input tailwind.input.css --output static/css/tailwind.css --minify
          test -s static/css/tailwind.css

      - name: Check Vercel dependencies and settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.vercel
          VERCEL_ENV: preview
          KUZENGA_RESOURCE_ENV: preview
          DATABASE_URL: postgresql://ci:ci@ci-pooler.example.invalid/kuzenga?sslmode=require
          KUZENGA_POOLED_DATABASE_HOST: ci-pooler.example.invalid
          DJANGO_SECRET_KEY: ci-only-kuzenga-vercel-settings-validation-do-not-deploy
          DJANGO_ALLOWED_HOSTS: kuzenga-preview.example.invalid
          KUZENGA_STORAGE_ENDPOINT: https://s3.example.invalid
          KUZENGA_STORAGE_BUCKET: kuzenga-ci-preview
          KUZENGA_STORAGE_ACCESS_KEY_ID: ci-only
          KUZENGA_STORAGE_SECRET_ACCESS_KEY: ci-only
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          python -c 'from config.wsgi import application; assert callable(application)'
          python manage.py check --deploy --fail-level ERROR
          python manage.py collectstatic --noinput

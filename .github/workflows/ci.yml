name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python 3.12, PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: kuzenga_ci
          POSTGRES_USER: kuzenga_ci
          POSTGRES_PASSWORD: kuzenga_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kuzenga_ci -d kuzenga_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: kuzenga

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://kuzenga_ci:kuzenga_ci_password@localhost:5432/kuzenga_ci
      DJANGO_SECRET_KEY: ci-only-not-a-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            kuzenga/requirements/base.txt
            kuzenga/requirements/production.txt
            kuzenga/requirements.txt
            kuzenga/requirements/development.txt
            kuzenga/requirements/constraints.txt

      - name: Install pinned project dependencies
        run: python -m pip install --requirement requirements/development.txt

      - name: Verify dependency installation
        run: python -m pip check

      - name: Run Ruff checks
        run: python -m ruff check .

      - name: Run Django system checks
        run: python manage.py check

      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run

      - name: Apply database migrations
        run: python manage.py migrate --noinput

      - name: Run pytest suite
        run: python -m pytest -ra

      - name: Verify concurrent PostgreSQL finance operations
        run: python -m pytest tests/test_finance_postgresql.py -ra
        env:
          KUZENGA_RUN_PG_ACCEPTANCE: "1"

      - name: Check offline production configuration and static collection
        run: python scripts/check_deployment.py

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned dependency auditor
        run: python -m pip install pip-audit==2.9.0

      - name: Audit pinned production dependencies
        working-directory: kuzenga
        run: python -m pip_audit --strict --requirement requirements/production.txt

  browser-smoke:
    name: Chromium public and portal smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kuzenga
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install project and pinned browser tooling
        run: |
          python -m pip install --requirement requirements/development.txt
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium

      - name: Capture read-only public DNS evidence
        run: python scripts/capture_public_dns.py

      - name: Run disposable browser acceptance
        run: python scripts/check_release_browser.py

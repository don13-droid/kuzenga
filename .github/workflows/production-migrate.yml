name: One-time production database migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MIGRATE_PRODUCTION to authorize production schema changes'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kuzenga-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirm == 'MIGRATE_PRODUCTION' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kuzenga
    env:
      DATABASE_URL: ${{ secrets.NEON_PRODUCTION_DATABASE_URL }}
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_PRODUCTION_MIGRATION_SECRET_KEY }}
      DJANGO_ALLOWED_HOSTS: www.elevondigitalzw.com,elevondigitalzw.com
      KUZENGA_RESOURCE_ENV: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Ensure production secrets are configured
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo 'Missing NEON_PRODUCTION_DATABASE_URL'; exit 1; }
          test -n "$DJANGO_SECRET_KEY" || { echo 'Missing DJANGO_PRODUCTION_MIGRATION_SECRET_KEY'; exit 1; }
      - name: Verify database target without printing credentials
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          u = urlsplit(os.environ['DATABASE_URL'])
          assert u.scheme in ('postgresql','postgres'), 'Expected PostgreSQL URL'
          assert u.path.lstrip('/') == 'kuzenga_production', 'Refusing to migrate non-production database'
          assert 'eu-central-1' in (u.hostname or ''), 'Unexpected Neon production region'
          print('Production database target verified')
          PY
      - name: Install pinned dependencies
        run: python -m pip install -r requirements/production.txt
      - name: Check migration plan
        run: python manage.py migrate --plan
      - name: Apply production migrations
        run: python manage.py migrate --noinput
      - name: Verify production tables
        run: |
          python manage.py shell -c "from django.db import connection; tables=set(connection.introspection.table_names()); required={'django_migrations','accounts_user'}; assert required <= tables, f'Missing tables: {required-tables}'; print('Production migration tables verified')"

<dialog id="school-confirmation" class="school-confirmation" aria-labelledby="school-confirmation-title" aria-describedby="school-confirmation-message">
  <h2 id="school-confirmation-title">Confirm action</h2>
  <p id="school-confirmation-message"></p>
  <form method="dialog" class="school-confirmation-actions">
    <button class="school-button school-button--secondary" value="cancel" autofocus>Cancel</button>
    <button class="school-button school-button--primary" value="confirm">Confirm</button>
  </form>
</dialog>

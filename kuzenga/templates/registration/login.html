{% extends "base/base.html" %}
{% block title %}Sign in - Kuzenga{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16 bg-white rounded-lg shadow p-6">
  <h1 class="text-xl font-semibold mb-4">Sign in</h1>
  <form method="post" class="space-y-3">{% csrf_token %}
    {% if form.errors %}<p class="text-red-700 text-sm">Incorrect email or password.</p>{% endif %}
    <label class="block text-sm">Email
      <input name="username" type="email" required autofocus class="mt-1 w-full border rounded px-3 py-2"></label>
    <label class="block text-sm">Password
      <input name="password" type="password" required class="mt-1 w-full border rounded px-3 py-2"></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="w-full bg-slate-900 text-white rounded py-2">Sign in</button>
  </form>
</div>
{% endblock %}

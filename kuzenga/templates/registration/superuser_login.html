{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Platform sign in · Kuzenga</title><link rel="stylesheet" href="{% static 'css/tailwind.css' %}"></head><body class="min-h-screen bg-[#f4f6fc] px-4 text-[#101d42]"><main class="mx-auto mt-16 max-w-md rounded-2xl border border-slate-200 bg-white p-7 shadow-xl">
  <div class="mb-6 border-b border-slate-100 pb-5"><p class="text-xs font-bold uppercase tracking-[.18em] text-amber-600">Kuzenga Platform</p><h1 class="mt-2 text-2xl font-bold text-[#101d42]">Superuser sign in</h1><p class="mt-2 text-sm text-slate-500">Sign in to manage schools and platform services.</p></div>
  <form method="post" class="space-y-4">{% csrf_token %}
    {% if form.errors %}<p class="rounded-lg bg-rose-50 px-3 py-2 text-sm text-rose-800">Invalid email or password.</p>{% endif %}
    <label class="block text-sm font-medium text-slate-700">Email<input name="username" type="email" required autofocus autocomplete="username" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2.5"></label>
    <label class="block text-sm font-medium text-slate-700">Password<input name="password" type="password" required autocomplete="current-password" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2.5"></label>
    <input type="hidden" name="next" value="{{ next }}"><button class="w-full rounded-lg bg-[#101d42] py-3 font-semibold text-white hover:bg-[#17264d]">Sign in to platform</button>
  </form>
</main></body></html>
